name: Android

# Every push builds an installable APK (Actions › the run › Artifacts).
# Pushing a tag like v1.2.0 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      architectures:
        description: "CPU architectures to build"
        default: "arm64-v8a"
        type: choice
        options: ["arm64-v8a", "arm64-v8a,armeabi-v7a"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish releases from tags

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Release signing (optional): add these repository secrets to sign with your own key.
      # Without them the APK is signed with the shared debug key, which is fine for testing.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test src

      - name: Generate the Android project
        run: CI=1 bunx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "HARMONI_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "HARMONI_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "HARMONI_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "HARMONI_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: More swap
        # React Native's C++ builds are memory hungry; extra swap keeps the runner alive.
        run: |
          # systemd-oomd SIGTERMs (exit 143) builds under memory pressure; the job has the machine to itself.
          sudo systemctl stop systemd-oomd || true
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build APK
        working-directory: android
        run: |
          # The generated file has no trailing newline: start on a new line.
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=3\n' >> gradle.properties
          tail -4 gradle.properties
          # arm64 covers every phone from about 2017 on; run the workflow by hand to add armv7.
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=${{ inputs.architectures || 'arm64-v8a' }} --no-daemon --build-cache

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/harmoni-${APP_VERSION}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: harmoni-${{ env.APP_VERSION }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
